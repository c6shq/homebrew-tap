name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify-packages:
        description: Install and verify all signed release packages on hosted macOS
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: brew test-bot --only-tap-syntax

  packages:
    # Formula/Cask downloads, Gatekeeper, and notarization checks are an explicit
    # release gate. Running the 10x-billed macOS job for every metadata push burned
    # the shared Actions allowance without adding coverage between releases.
    if: github.event_name == 'workflow_dispatch' && inputs.verify-packages == true
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: brew audit --strict --online c6shq/tap/c6s
      - run: brew install c6shq/tap/c6s
      - run: brew test c6shq/tap/c6s
      - run: brew audit --strict --online c6shq/tap/c6s-beta
      - run: brew install c6shq/tap/c6s-beta
      - run: brew test c6shq/tap/c6s-beta
      - run: brew audit --cask --strict --online c6shq/tap/cerberus
      - run: brew install --cask c6shq/tap/cerberus
      - run: codesign --verify --deep --strict --verbose=2 /Applications/Cerberus.app
      - run: xcrun stapler validate /Applications/Cerberus.app
      - run: brew audit --cask --strict --online c6shq/tap/cerberus@beta
      - run: brew install --cask c6shq/tap/cerberus@beta
      - run: codesign --verify --deep --strict --verbose=2 '/Applications/Cerberus Beta.app'
      - run: xcrun stapler validate '/Applications/Cerberus Beta.app'
